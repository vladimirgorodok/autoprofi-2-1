function csv(t){t=t.replace(/^\uFEFF/,'');const rows=[];let r=[],c='',qq=false;for(let i=0;i<t.length;i++){const ch=t[i];if(qq){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else qq=false}else c+=ch}else if(ch=='"')qq=true;else if(ch==','){r.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);c='';rows.push(r);r=[]}else c+=ch}
if(c||r.length){r.push(c);rows.push(r)}const h=rows.shift()||[];return rows.filter(x=>x.length>1).map(x=>Object.fromEntries(h.map((k,i)=>[k,x[i]??'']))) }

if(e=='waybills'){
const tr=vals('trips').filter(x=>x.waybillId==id).sort((a,b)=>String(a.name).localeCompare(b.name)),fu=vals('fuels').filter(x=>x.waybillId==id).sort((a,b)=>String(b.dateTime).localeCompare(a.dateTime)),fi=vals('finances').filter(x=>x.waybillId==id).sort((a,b)=>String(b.date).localeCompare(a.date));
const km=Math.max(0,num(r.odometerIn)-num(r.odometerOut)),L=fu.reduce((x,f)=>x+num(f.liters),0),used=num(r.fuelOut)+L-num(r.fuelIn),cons=km>0?used/km*100:0,nrm=num((D.vehicles[r.vehicleId]||{}).fuelNorm),ac=fsum(fi,'Начислено'),pd=fsum(fi,'Оплачено');
h+='<div class="c"><h2>'+esc(lbl(e,r))+'</h2><small>'+esc(nm('vehicles',r.vehicleId))+(r.trailerId?' + '+esc(nm('vehicles',r.trailerId)):'')+(r.returnDate?'':' · <span class="ok">открыт</span>')+'</small><div class="g" style="margin-top:8px">'+cell('Пробег',km.toLocaleString('ru-RU')+' км')+cell('Заправлено',L.toLocaleString('ru-RU')+' л')+cell('Израсходовано',Math.round(used)+' л')+cell('Расход',cons?cons.toFixed(1)+' л/100':'—')+cell('Норма',nrm?nrm+' л/100':'—')+cell('Остаток топлива',num(r.fuelIn)+' л')+'</div><div class="g" style="margin-top:8px">'+cell('Начислено',mny(ac))+cell('Оплачено',mny(pd))+cell('Долг',mny(ac-pd))+'</div>'+(r.notes?'<p style="white-space:pre-wrap;margin:8px 0 0">'+esc(r.notes)+'</p>':'')+'<div class="bar"><button data-ed="1">Изменить лист</button></div></div>';
h+=sec('Поездки','trips',tr,{waybillId:id})+sec('Заправки','fuels',fu,{waybillId:id,dateTime:now,source:'АЗС'})+sec('Финансы','finances',fi,{waybillId:id,type:'Оплачено',date:now})}
else{
const st=vals('stops').filter(x=>x.tripId==id).sort((a,b)=>num(a.order)-num(b.order)),fi=vals('finances').filter(x=>x.tripId==id).sort((a,b)=>String(b.date).localeCompare(a.date));
h+='<div class="c"><h2>'+esc(r.name)+'</h2><small>'+esc([r.cargo,r.weightKg?r.weightKg+' кг':'',r.loadingType].filter(Boolean).join(' · '))+'</small><div class="g" style="margin-top:8px">'+cell('Начислено',mny(r.accrual)||'—')+cell('Оплачено',mny(fsum(fi,'Оплачено')))+cell('Лист','<span style="font-size:12px">'+esc(nm('waybills',r.waybillId)||'—')+'</span>')+'</div>'+(r.notes?'<p style="white-space:pre-wrap;margin:8px 0 0">'+esc(r.notes)+'</p>':'')+'<div class="bar"><button data-ed="1">Изменить поездку</button></div></div>';
h+=sec('Маршрут','stops',st,{tripId:id,order:st.length+1,direction:st.length?'Выгрузка':'Погрузка'},s=>'<div class="r" data-e="stops" data-i="'+s.id+'"><span>'+esc(s.direction+' · '+(nm('places',s.placeId)||s.placeName||'место не указано'))+'<small>'+esc(ents.stops.s(s)||'без даты')+'</small></span>'+(s.arrivedAt?'<span class="a ok">✓</span>':'<button class="s" data-arr="'+s.id+'">Прибыл</button>')+'</div>')
+sec('Финансы','finances',fi,{tripId:id,waybillId:r.waybillId,type:'Начислено',amount:r.accrual,date:now})}
return h}

/* ---------- Каркас ---------- */
const NAV=[['home','🏠','Главная'],['waybills','📋','Листы'],['trips','🚚','Поездки'],['fuels','⛽','Заправки'],['finances','💰','Финансы'],['more','☰','Ещё']];
function render(){
$('#nv').innerHTML=NAV.map(([k,i,t])=>'<a data-t="'+k+'" class="'+(tab==k?'on':'')+'"><i>'+i+'</i>'+t+'</a>').join('');
const m=$('#m');let h='';
if(!db)h+='<div class="c warn">Облачная база недоступна. Откройте страницу в claude.ai, войдя в аккаунт.</div>';
if(view)h+=det();else if(tab=='home')h+=home();else if(tab=='more'){h+=(more?'<button class="s" data-go="">← Назад</button><h2 style="margin:10px 0">'+ents[ent].t+'</h2>'+list(ent):more_())}else h+=list(tab);
const fo=document.activeElement&&document.activeElement.id=='q';m.innerHTML=h;
if(fo){const e=$('#q');if(e){e.focus();e.setSelectionRange(e.value.length,e.value.length)}}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-t],[data-e],[data-new],[data-go],[data-nd],#exp,#lo,[data-back],[data-ed],[data-arr]');if(!t)return;
if(t.dataset.t){tab=t.dataset.t;more=false;view=null;vs=[];q='';scrollTo(0,0);render()}
else if(t.dataset.nd){sb.from('fuels').update({notDup:true}).eq('id',t.dataset.nd).then(()=>load('fuels')).then(render)}
else if(t.dataset.arr)sb.from('stops').update({arrivedAt:new Date().toISOString()}).eq('id',t.dataset.arr).then(()=>load('stops')).then(render);else if(t.dataset.back){view=vs.pop()||null;scrollTo(0,0);render()}else if(t.dataset.ed)sheet(view.e,view.id);else if(t.dataset.e){if(t.dataset.e=='waybills'||t.dataset.e=='trips'){vs.push(view);view={e:t.dataset.e,id:t.dataset.i};scrollTo(0,0);render()}else sheet(t.dataset.e,t.dataset.i)}
else if(t.dataset.new)sheet(t.dataset.new,null,t.dataset.pre?JSON.parse(t.dataset.pre):null);
else if(t.id=='exp')doExport();else if(t.id=='lo')sb.auth.signOut().then(()=>location.reload());
else if(t.dataset.go!==undefined){if(t.dataset.go){ent=t.dataset.go;more=true}else more=false;q='';render()}});
document.addEventListener('input',e=>{if(e.target.id=='q'){q=e.target.value;render()}});
document.addEventListener('change',e=>{if(e.target.id=='imp')doImport([...e.target.files])});
async function load(k){const{data,error}=await sb.from(T(k)).select('*').limit(5000);let rows=data;
if(error){try{rows=JSON.parse(localStorage.getItem('d_'+k)||'[]')}catch(e){rows=[]}$('#st').textContent='Офлайн (кэш)'}else{try{localStorage.setItem('d_'+k,JSON.stringify(data))}catch(e){}}
D[k]={};(rows||[]).forEach(r=>D[k][r.id]=r)}
async function loadAll(){$('#st').textContent='Загрузка…';await Promise.all(Object.keys(ents).map(load));if($('#st').textContent=='Загрузка…')$('#st').textContent='☁ Синхронизировано'}
function authView(){$('#nv').innerHTML='';$('#m').innerHTML='<div class="c"><h2>Вход</h2><label>Email</label><input id="em" type="email" autocomplete="username"><label>Пароль</label><input id="pw" type="password" autocomplete="current-password"><div class="bar"><button id="li">Войти</button></div><small id="ae" class="warn"></small></div>';
$('#li').onclick=async()=>{const{error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});if(error)$('#ae').textContent='Не удалось войти: '+error.message;else start()}}
async function start(){const{data}=await sb.auth.getSession();if(!data.session){$('#st').textContent='Нужен вход';authView();return}db=true;render();await loadAll();render()}
start();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
